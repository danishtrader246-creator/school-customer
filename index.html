<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Customer Support</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f7fb;
}

header{
    background:#0056b3;
    color:#fff;
    text-align:center;
    padding:20px;
}

.container{
    width:90%;
    max-width:700px;
    margin:40px auto;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h2{
    margin-bottom:20px;
    color:#0056b3;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input, select, textarea{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

textarea{
    resize:vertical;
    height:120px;
}

button{
    margin-top:20px;
    width:100%;
    padding:14px;
    background:#0056b3;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#003d80;
}

#status{
    margin-top:20px;
    text-align:center;
    font-weight:bold;
}
</style>

</head>
<body>

<header>
<h1>School Customer Support</h1>
<p>Submit your query and our team will contact you soon.</p>
</header>

<div class="container">

<h2>Support Form</h2>

<form id="supportForm">

<label>Student Name</label>
<input type="text" id="name" required>

<label>Email</label>
<input type="email" id="email" required>

<label>Phone Number</label>
<input type="text" id="phone">

<label>Class</label>
<select id="class">
<option>Grade 1</option>
<option>Grade 2</option>
<option>Grade 3</option>
<option>Grade 4</option>
<option>Grade 5</option>
<option>Grade 6</option>
<option>Grade 7</option>
<option>Grade 8</option>
<option>Grade 9</option>
<option>Grade 10</option>
</select>

<label>Subject</label>
<input type="text" id="subject" required>

<label>Message</label>
<textarea id="message" required></textarea>

<button type="submit">Send Request</button>

</form>

<div id="status"></div>

</div>

<script>

document.getElementById("supportForm").addEventListener("submit", async function(e){

e.preventDefault();

const data = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    phone: document.getElementById("phone").value,
    class: document.getElementById("class").value,
    subject: document.getElementById("subject").value,
    message: document.getElementById("message").value,
    source: "School Support Website",
    date: new Date().toISOString()
};

try{

const response = await fetch("https://hook.us2.make.com/0qunu5occt7gkzbjog3t8bvc826wg4oi",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(data)
});

if(response.ok){
document.getElementById("status").innerHTML="Request Submitted Successfully!";
document.getElementById("supportForm").reset();
}else{
document.getElementById("status").innerHTML="Error sending request.";
}

}catch(err){
document.getElementById("status").innerHTML="Connection Error.";
console.log(err);
}

});

</script>

</body>
</html>
